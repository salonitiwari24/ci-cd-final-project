apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pipelinerun-pvc
  labels:
    app: hit-counter
    component: cd-pipeline
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: skills-network-learner
  resources:
    requests:
      storage: 1Gi
